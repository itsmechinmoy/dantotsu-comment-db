<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dantotsu Comment DB Archive</title>
  <link rel="icon" href="https://files.catbox.moe/1f7ay7.png" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #0b0e14; color: #e0e0e0; padding: 20px; margin: 0; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #151921; padding: 20px; border-radius: 8px; border: 1px solid #232935; margin-bottom: 20px; flex-shrink: 0; }
    
    .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
    input { background: #151921; border: 1px solid #232935; color: white; padding: 10px; flex-grow: 1; border-radius: 4px; }
    
    /* FIX: Header titles stay on one line */
    th { 
        background: #1c222d; 
        text-align: left; 
        border: 1px solid #232935;
        border-bottom: 2px solid #333; 
        padding: 10px;
        white-space: nowrap; 
        overflow: hidden;
        text-overflow: ellipsis;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    /* Virtual Scroll Container */
    .table-viewport {
        flex-grow: 1;
        overflow-y: auto;
        background: #151921;
        border-radius: 8px;
        border: 1px solid #232935;
    }

    table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
    td { padding: 8px 10px; border: 1px solid #232935; word-break: break-word; overflow: hidden; }
    
    /* Column Widths to keep layout stable */
    .col-id { width: 60px; }
    .col-user { width: 70px; }
    .col-media { width: 70px; }
    .col-content { width: 300px; }
    .col-date { width: 130px; }
    .col-small { width: 50px; }
    .col-user-info { width: 120px; }

    .mod-badge { color: #ff9800; font-weight: bold; border: 1px solid #ff9800; padding: 1px 3px; border-radius: 3px; font-size: 9px; }
    .deleted-row { opacity: 0.6; background: #2a1515 !important; }
    .link { color: #3dbbee; text-decoration: none; font-weight: bold; }
    tr:hover { background: #1c222d; }

    .avatar-img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; vertical-align: middle; }
    .spoiler { background: #42464d; color: #42464d; padding: 0 2px; border-radius: 3px; cursor: pointer; }
    .spoiler.revealed { background: rgba(255,255,255,0.1); color: inherit; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Dantotsu Comment DB Archive</h1>
    <div class="controls">
      <input type="text" id="search" placeholder="Search content, usernames, or IDs..." />
      <span>Total Database: <strong id="count">0</strong></span>
    </div>
  </div>

  <div class="table-viewport" id="viewport">
    <table id="mainTable">
      <thead>
        <tr>
            <th class="col-id">COMMENT ID</th>
            <th class="col-user">USER ID</th>
            <th class="col-media">MEDIA ID</th>
            <th class="col-small">REPLIED TO</th>
            <th class="col-content">CONTENT</th>
            <th class="col-date">DATE/TIME</th>
            <th class="col-small">DELETED</th>
            <th class="col-small">TAG</th>
            <th class="col-small">LIKES</th>
            <th class="col-small">DISLIKES</th>
            <th class="col-small">SELF VOTED</th>
            <th class="col-user-info">USERNAME</th>
            <th class="col-small">AVATAR</th>
            <th class="col-small">MOD</th>
            <th class="col-small">ADMIN</th>
            <th class="col-small">REPLIES</th>
            <th class="col-small">TOTAL LIKES</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let rawData = [];
    let filteredData = [];
    const ROW_HEIGHT = 45; // Approximate height of a row
    const VISIBLE_ROWS = 40; // Number of rows to render at once

    // Markdown Configuration
    const renderer = new marked.Renderer();
    renderer.text = (text) => text.replace(/\|\|([\s\S]+?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
    marked.setOptions({ renderer, breaks: true, gfm: true });

    async function init() {
      const res = await fetch('dantotsu_global_db.csv');
      const text = await res.text();
      Papa.parse(text, { 
        header: true, delimiter: "\t", skipEmptyLines: true, 
        complete: (results) => {
          rawData = results.data.sort((a, b) => parseInt(b.comment_id) - parseInt(a.comment_id));
          filteredData = rawData;
          document.getElementById('count').innerText = rawData.length;
          renderVirtualTable();
        }
      });
    }

    function formatBool(val) {
        return (val === '1' || val === 1 || val === "true") ? '✅' : '❌';
    }

    function renderVirtualTable() {
      const viewport = document.getElementById('viewport');
      const tbody = document.getElementById('tbody');
      
      const scrollTop = viewport.scrollTop;
      const startIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - 5);
      const endIndex = Math.min(filteredData.length, startIndex + VISIBLE_ROWS + 10);

      // Create padding to keep scrollbar correct
      const paddingTop = startIndex * ROW_HEIGHT;
      const paddingBottom = (filteredData.length - endIndex) * ROW_HEIGHT;

      const displayData = filteredData.slice(startIndex, endIndex);
      
      tbody.innerHTML = `<tr style="height: ${paddingTop}px"><td colspan="17" style="border:none"></td></tr>` + 
        displayData.map(row => {
          const isDeleted = row.deleted === '1';
          const isMod = row.is_mod === '1' || row.is_admin === '1';
          const dateStr = row.timestamp ? new Date(row.timestamp * 1000).toLocaleString() : 'N/A';
          
          return `
            <tr class="${isDeleted ? 'deleted-row' : ''}" style="height: ${ROW_HEIGHT}px">
              <td>${row.comment_id}</td>
              <td><a class="link" href="https://anilist.co/user/${row.user_id}" target="_blank">${row.user_id}</a></td>
              <td><a class="link" href="https://anilist.co/anime/${row.media_id}" target="_blank">${row.media_id}</a></td>
              <td>${row.parent_comment_id || ''}</td>
              <td class="col-content">${marked.parse(row.content || "")}</td>
              <td>${dateStr}</td>
              <td align="center">${formatBool(row.deleted)}</td>
              <td>${row.tag || ''}</td>
              <td>${row.upvotes}</td>
              <td>${row.downvotes}</td>
              <td>${row.user_vote_type || '0'}</td>
              <td><strong>${row.username}</strong> ${isMod ? '<span class="mod-badge">MOD</span>' : ''}</td>
              <td align="center"><img src="${row.profile_picture_url}" class="avatar-img" onerror="this.src='https://files.catbox.moe/1f7ay7.png'"></td>
              <td align="center">${formatBool(row.is_mod)}</td>
              <td align="center">${formatBool(row.is_admin)}</td>
              <td>${row.reply_count}</td>
              <td>${row.total_votes}</td>
            </tr>`;
        }).join('') + 
        `<tr style="height: ${paddingBottom}px"><td colspan="17" style="border:none"></td></tr>`;
    }

    document.getElementById('viewport').addEventListener('scroll', renderVirtualTable);

    document.getElementById('search').addEventListener('input', (e) => {
      const t = e.target.value.toLowerCase();
      filteredData = rawData.filter(r => 
        (r.content?.toLowerCase().includes(t)) || 
        (r.username?.toLowerCase().includes(t)) || 
        (r.media_id?.includes(t)) ||
        (r.comment_id?.includes(t))
      );
      document.getElementById('viewport').scrollTop = 0;
      renderVirtualTable();
    });

    init();
  </script>
</body>
</html>
