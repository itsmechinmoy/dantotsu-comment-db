<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dantotsu Comment Archive</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #0b0e14; color: #e0e0e0; padding: 20px; }
    .header { background: #151921; padding: 20px; border-radius: 8px; border: 1px solid #232935; margin-bottom: 20px; }
    input { background: #151921; border: 1px solid #232935; color: white; padding: 10px; width: 100%; border-radius: 4px; }
    .table-container { background: #151921; border-radius: 8px; border: 1px solid #232935; margin-top: 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #1c222d; padding: 12px; text-align: left; border-bottom: 2px solid #232935; }
    td { padding: 12px; border-bottom: 1px solid #232935; }
    .mod-badge { color: #ff9800; font-weight: bold; border: 1px solid #ff9800; padding: 2px 4px; border-radius: 3px; font-size: 10px; }
    .deleted { opacity: 0.4; color: #ff5252; text-decoration: line-through; }
    .link { color: #3dbbee; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Dantotsu Comment Archive</h1>
    <p>Live Database Mirror | Total: <span id="count">0</span></p>
    <input type="text" id="search" placeholder="Search content, users, or Media ID..." />
  </div>
  <div class="table-container">
    <table>
      <thead>
        <tr><th>ID</th><th>User</th><th>Media</th><th>Comment</th><th>Votes</th></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <script>
    let raw = [];
    async function init() {
      const res = await fetch('dantotsu_global_db.csv');
      const text = await res.text();
      Papa.parse(text, { header: true, delimiter: "\t", skipEmptyLines: true, complete: (r) => {
        raw = r.data.reverse();
        document.getElementById('count').innerText = raw.length;
        render(raw.slice(0, 100));
      }});
    }
    function render(data) {
      const b = document.getElementById('body');
      b.innerHTML = data.map(r => `
        <tr class="${r.deleted == '1' ? 'deleted' : ''}">
          <td>${r.comment_id}</td>
          <td><strong>${r.username}</strong> ${r.is_mod == '1' ? '<span class="mod-badge">MOD</span>' : ''}</td>
          <td><a class="link" href="https://anilist.co/anime/${r.media_id}" target="_blank">${r.media_id}</a></td>
          <td>${r.content}</td>
          <td>↑${r.upvotes}</td>
        </tr>`).join('');
    }
    document.getElementById('search').addEventListener('input', (e) => {
      const t = e.target.value.toLowerCase();
      const f = raw.filter(r => r.username.toLowerCase().includes(t) || r.content.toLowerCase().includes(t) || r.media_id.includes(t));
      render(f.slice(0, 100));
    });
    init();
  </script>
</body>
</html>
